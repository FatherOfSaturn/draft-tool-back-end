buildscript {
    repositories { mavenCentral() }
    configurations.classpath {
        resolutionStrategy.eachDependency { details ->
            // Hardening for VMware buildscript-only deps (Quarkus Gradle plugin stack).
            // These are build-time only and never ship in the application image.
            if (details.requested.group == 'com.fasterxml.jackson.core' && details.requested.name == 'jackson-core') {
                details.useVersion '2.22.3'
                details.because 'CVE fixes (buildscript classpath): _reportInvalidToken error-token DoS (GHSA-7hhh-6rmp-j9qf), NumberInput.PATTERN_FLOAT ReDoS (GHSA-p6pp-m3f8-5c89)'
            }
            if (details.requested.group == 'org.codehaus.plexus' && details.requested.name == 'plexus-utils') {
                details.useVersion '4.0.3'
                details.because 'CVE fix (buildscript classpath): directory traversal in extractFile (GHSA-6fmv-xxpf-w3cw)'
            }
            if (details.requested.group == 'com.google.guava' && details.requested.name == 'guava') {
                details.useVersion '33.7.2-jre'
                details.because 'CVE fix (buildscript classpath): CompactHashMap/MapMakerInternalMap deserialization DoS (GHSA-xxph-c9ww-hj94)'
            }
        }
    }
}

plugins {
    id 'java'
    id 'io.quarkus'
    id 'jacoco'
    id 'org.owasp.dependencycheck' version '13.0.0'
}

jacoco {
    toolVersion = "0.8.14"
}

repositories {
    mavenCentral()
    mavenLocal()
}

dependencies {
    implementation enforcedPlatform("${quarkusPlatformGroupId}:${quarkusPlatformArtifactId}:${quarkusPlatformVersion}")
    implementation 'io.quarkus:quarkus-mutiny'
    implementation 'io.quarkus:quarkus-resteasy-client-mutiny'
    implementation 'io.quarkus:quarkus-smallrye-health'
    implementation 'io.quarkus:quarkus-smallrye-openapi'
    implementation 'io.quarkus:quarkus-config-yaml'
    implementation 'io.quarkus:quarkus-scheduler'
    implementation 'io.quarkus:quarkus-smallrye-context-propagation'
    implementation 'io.quarkus:quarkus-smallrye-jwt'
    implementation 'io.quarkus:quarkus-smallrye-jwt-build'
    implementation 'io.quarkus:quarkus-hibernate-validator'

    implementation 'io.quarkus:quarkus-resteasy-jackson'
    implementation 'io.quarkus:quarkus-arc'
    runtimeOnly 'org.jboss.logmanager:log4j2-jboss-logmanager'
    implementation 'org.apache.logging.log4j:log4j-api:2.25.5'

    implementation 'io.quarkus:quarkus-mongodb-client'
    implementation 'org.mongodb:mongodb-driver-sync:5.14.0'
    implementation 'org.mongodb:mongodb-driver-core:5.14.0'
    implementation 'org.mongodb:bson:5.14.0'

    implementation 'io.jsonwebtoken:jjwt-api:0.13.0'
    runtimeOnly 'io.jsonwebtoken:jjwt-impl:0.13.0'
    runtimeOnly 'io.jsonwebtoken:jjwt-jackson:0.13.0'

    compileOnly 'org.projectlombok:lombok:1.18.42'
    annotationProcessor 'org.projectlombok:lombok:1.18.42'

    implementation 'org.mapstruct:mapstruct:1.6.3'
    // Order matters: Lombok, then the Lombok/MapStruct binding, then MapStruct.
    annotationProcessor 'org.projectlombok:lombok-mapstruct-binding:0.2.0'
    annotationProcessor 'org.mapstruct:mapstruct-processor:1.6.3'

    testImplementation 'org.mockito:mockito-core:5.20.0'
    testImplementation 'org.mockito:mockito-junit-jupiter:5.20.0'
    testImplementation 'commons-io:commons-io:2.22.0'
    testImplementation 'io.quarkus:quarkus-junit5'
    testImplementation 'io.quarkus:quarkus-junit5-mockito'
    testImplementation 'io.rest-assured:rest-assured'
}

configurations.all {
    // Version pins (netty, vert.x, jackson, guava, jsoup, opentelemetry) were
    // removed with the Quarkus 3.40 LTS upgrade: the platform BOM now ships
    // patched versions carrying the original CVE fixes. Log4j is likewise
    // BOM-managed and resolves to 2.26.0, which already contains the 2.25.5
    // MDC/SafeFormatter vulnerability fix, so no explicit pin is needed.
}

group 'org.magic.draft'
version '1.0.0-SNAPSHOT'

java {
    sourceCompatibility = JavaVersion.VERSION_25
    targetCompatibility = JavaVersion.VERSION_25
}

test {
    systemProperty "java.util.logging.manager", "org.jboss.logmanager.LogManager"
    finalizedBy jacocoTestReport
}
compileJava {
    options.encoding = 'UTF-8'
    options.compilerArgs << '-parameters'
}

compileTestJava {
    options.encoding = 'UTF-8'
}

jacocoTestReport {
    dependsOn test
    reports {
        xml.required = false
        csv.required = false
        html.required = true
    }
    afterEvaluate {
        classDirectories.setFrom(files(classDirectories.files.collect {
            fileTree(dir: it, exclude: [
                'org/magic/pyramidDraft/api/**',
                'org/magic/accountService/api/**',
                'org/magic/common/util/**',
                'org/magic/common/api/scryfall/BulkDataEntry.class',
                'org/magic/common/api/admin/ScryfallCacheStatusResponse.class',
                'org/magic/common/external/ScryfallCardCache.class',
                'org/magic/common/external/ScryfallBulkDataService.class',
                'org/magic/lobbyService/**'
            ])
        }))
    }
}

jacocoTestCoverageVerification {
    dependsOn jacocoTestReport
    afterEvaluate {
        classDirectories.setFrom(files(classDirectories.files.collect {
            fileTree(dir: it, exclude: [
                'org/magic/pyramidDraft/api/**',
                'org/magic/accountService/api/**',
                'org/magic/common/util/**',
                'org/magic/common/api/scryfall/BulkDataEntry.class',
                'org/magic/common/api/admin/ScryfallCacheStatusResponse.class',
                'org/magic/common/external/ScryfallCardCache.class',
                'org/magic/common/external/ScryfallBulkDataService.class',
                'org/magic/lobbyService/**'
            ])
        }))
    }
    violationRules {
        rule {
            limit {
                counter = 'LINE'
                value = 'COVEREDRATIO'
                minimum = 0.70
            }
            limit {
                counter = 'BRANCH'
                value = 'COVEREDRATIO'
                minimum = 0.40
            }
        }
    }
}

check.dependsOn jacocoTestCoverageVerification

dependencyCheck {
    failBuildOnCVSS = 7
    failOnError = false
    suppressionFile = "${rootDir}/dependency-check-suppressions.xml"
    outputDirectory = "${rootDir}/build/reports/dependency-check"
    formats = ['HTML', 'JSON']
    analyzers {
        assemblyEnabled = false
        nodeEnabled = false
        nugetconfEnabled = false
    }
}
