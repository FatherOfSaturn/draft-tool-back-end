plugins {
    id 'java'
    id 'io.quarkus'
    id 'jacoco'
    id 'org.owasp.dependencycheck' version '11.1.1'
}

jacoco {
    toolVersion = "0.8.12"
}

repositories {
    mavenCentral()
    mavenLocal()
}

dependencies {
    implementation enforcedPlatform("${quarkusPlatformGroupId}:${quarkusPlatformArtifactId}:${quarkusPlatformVersion}")
    implementation 'io.quarkus:quarkus-mutiny'
    implementation 'io.quarkus:quarkus-resteasy-client-mutiny'
    implementation 'io.quarkus:quarkus-smallrye-health'
    implementation 'io.quarkus:quarkus-smallrye-openapi'
    implementation 'io.quarkus:quarkus-config-yaml'
    implementation 'io.quarkus:quarkus-scheduler'
    implementation 'io.quarkus:quarkus-smallrye-context-propagation'
    implementation 'io.quarkus:quarkus-smallrye-jwt'
    implementation 'io.quarkus:quarkus-smallrye-jwt-build'
    implementation 'io.quarkus:quarkus-hibernate-validator'

    implementation 'io.quarkus:quarkus-resteasy-jackson'
    implementation 'io.quarkus:quarkus-arc'
    runtimeOnly 'org.jboss.logmanager:log4j2-jboss-logmanager'
    implementation 'org.apache.logging.log4j:log4j-api:2.23.1'

    implementation 'io.quarkus:quarkus-mongodb-client'
    implementation 'org.mongodb:mongodb-driver-sync:4.8.0'
    implementation 'org.mongodb:mongodb-driver-core:4.8.0'
    implementation 'org.mongodb:bson:4.8.0'

    implementation 'io.jsonwebtoken:jjwt-api:0.12.6'
    runtimeOnly 'io.jsonwebtoken:jjwt-impl:0.12.6'
    runtimeOnly 'io.jsonwebtoken:jjwt-jackson:0.12.6'

    compileOnly 'org.projectlombok:lombok:1.18.30'
    annotationProcessor 'org.projectlombok:lombok:1.18.30'

    testImplementation 'org.mockito:mockito-core:5.14.2'
    testImplementation 'org.mockito:mockito-junit-jupiter:5.14.2'
    testImplementation 'commons-io:commons-io:2.16.1'
    testImplementation 'io.quarkus:quarkus-junit5'
    testImplementation 'io.rest-assured:rest-assured'
}

configurations.all {
    resolutionStrategy.eachDependency { details ->
        if (details.requested.group == 'io.netty') {
            details.useVersion '4.1.137.Final'
            details.because 'CVE fixes: HTTP request smuggling (CVE-2026-33870, CVE-2026-42580, CVE-2026-42585), HTTP/2 CONTINUATION flood (CVE-2026-33871), decompression bomb (CVE-2026-42587), HTTP/2 reset (CVE-2026-50560), SNI allocation (CVE-2026-45416), IPv6 filter bypass (CVE-2026-44249), hostname verification (CVE-2026-50010), proxy header injection (CVE-2026-42578), HTTP/2 ByteBuf leak (CVE-2026-56819), CORS bypass (CVE-2026-56746)'
        }
        if (details.requested.group == 'io.vertx') {
            details.useVersion '4.5.27'
            details.because 'CVE fix: unbounded server-side SNI SslContext cache growth DoS (CVE-2026-6860)'
        }
        if (details.requested.group == 'com.fasterxml.jackson.core' &&
                details.requested.name in ['jackson-databind', 'jackson-core']) {
            details.useVersion '2.18.9'
            details.because 'CVE fixes: @JsonIgnore/JsonIgnoreProperties/JsonView bypasses (CVE-2026-59888, CVE-2026-59889, CVE-2026-54515, GHSA-mhm7-754m-9p8w), polymorphic validator bypasses (CVE-2026-54512, CVE-2026-54513), InetSocketAddress DNS SSRF (CVE-2026-54514), async parser DoS (GHSA-r7wm-3cxj-wff9, CVE-2026-18401)'
        }
    }
}

group 'org.magic.draft'
version '1.0.0-SNAPSHOT'

java {
    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17
}

test {
    systemProperty "java.util.logging.manager", "org.jboss.logmanager.LogManager"
    finalizedBy jacocoTestReport
}
compileJava {
    options.encoding = 'UTF-8'
    options.compilerArgs << '-parameters'
}

compileTestJava {
    options.encoding = 'UTF-8'
}

jacocoTestReport {
    dependsOn test
    reports {
        xml.required = false
        csv.required = false
        html.required = true
    }
    afterEvaluate {
        classDirectories.setFrom(files(classDirectories.files.collect {
            fileTree(dir: it, exclude: [
                'org/magic/pyramidDraft/api/**',
                'org/magic/accountService/api/**',
                'org/magic/common/util/**',
                'org/magic/common/api/scryfall/BulkDataEntry.class',
                'org/magic/common/api/admin/ScryfallCacheStatusResponse.class',
                'org/magic/common/external/ScryfallCardCache.class',
                'org/magic/common/external/ScryfallBulkDataService.class',
                'org/magic/lobbyService/**'
            ])
        }))
    }
}

jacocoTestCoverageVerification {
    dependsOn jacocoTestReport
    afterEvaluate {
        classDirectories.setFrom(files(classDirectories.files.collect {
            fileTree(dir: it, exclude: [
                'org/magic/pyramidDraft/api/**',
                'org/magic/accountService/api/**',
                'org/magic/common/util/**',
                'org/magic/common/api/scryfall/BulkDataEntry.class',
                'org/magic/common/api/admin/ScryfallCacheStatusResponse.class',
                'org/magic/common/external/ScryfallCardCache.class',
                'org/magic/common/external/ScryfallBulkDataService.class',
                'org/magic/lobbyService/**'
            ])
        }))
    }
    violationRules {
        rule {
            limit {
                counter = 'LINE'
                value = 'COVEREDRATIO'
                minimum = 0.70
            }
            limit {
                counter = 'BRANCH'
                value = 'COVEREDRATIO'
                minimum = 0.40
            }
        }
    }
}

check.dependsOn jacocoTestCoverageVerification

dependencyCheck {
    failBuildOnCVSS = 7
    failOnError = false
    suppressionFile = "${rootDir}/dependency-check-suppressions.xml"
    outputDirectory = "${rootDir}/build/reports/dependency-check"
    formats = ['HTML', 'JSON']
    analyzers {
        assemblyEnabled = false
        nodeEnabled = false
        nugetconfEnabled = false
    }
}
