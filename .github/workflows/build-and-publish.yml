name: Build and Publish Docker Image to GHCR

on:
  push:
    branches:
      - main
      - dev
      - 'feature/**'
    tags:
      - 'v*.*.*'

permissions:
  contents: read
  packages: write

jobs:
  build-and-publish:
    runs-on: ubuntu-latest

    # The Quarkus test profile connects to mongodb://127.0.0.1:27017.
    # The service container publishes that port on the runner; the wait step
    # below verifies it and starts a container directly if the service is not
    # reachable (self-hosted or restricted runners), with diagnostics.
    services:
      mongodb:
        image: mongo:8
        ports:
          - "27017:27017"
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.runCommand({ping:1}).ok'"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up JDK
        uses: actions/setup-java@v6
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Build with Gradle
        run: ./gradlew build

      - name: Ensure MongoDB is reachable
        run: |
          set -uo pipefail
          mongo_up() { timeout 2 bash -c '</dev/tcp/127.0.0.1/27017' 2>/dev/null; }

          echo "Service containers:"
          docker ps -a --format 'table {{.Names}}\t{{.Image}}\t{{.Ports}}\t{{.Status}}' || true

          for i in $(seq 1 15); do
            if mongo_up; then
              echo "MongoDB service container reachable on 127.0.0.1:27017"
              exit 0
            fi
            sleep 2
          done

          echo "Service container not reachable; starting MongoDB directly"
          docker rm -f ci-mongodb >/dev/null 2>&1 || true
          docker run -d --name ci-mongodb -p 27017:27017 mongo:8

          for i in $(seq 1 30); do
            if mongo_up; then
              echo "MongoDB container ready on 127.0.0.1:27017"
              exit 0
            fi
            sleep 2
          done

          echo "MongoDB did not become reachable; container state and logs:"
          docker ps -a || true
          docker logs ci-mongodb || true
          exit 1

      - name: Integration tests (MongoDB-backed end-to-end)
        env:
          MONGO_TEST_CONNECTION_STRING: mongodb://127.0.0.1:27017
        run: ./gradlew integrationTest

      - name: Determine tags, build, and publish
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          IMAGE="ghcr.io/$OWNER/back-end"
          TAGS="$IMAGE:${{ github.sha }}"

          if [[ "${{ github.ref_type }}" == "tag" ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
            TAGS="$TAGS,$IMAGE:$VERSION"
          elif [[ "${{ github.ref_type }}" == "branch" && "${{ github.ref_name }}" != "main" ]]; then
            SAFE_NAME=$(echo "${{ github.ref_name }}" | tr '/' '-')
            TAGS="$TAGS,$IMAGE:$SAFE_NAME"
          else
            TAGS="$TAGS,$IMAGE:latest"
          fi

          echo "$GITHUB_TOKEN" | docker login ghcr.io -u "$OWNER" --password-stdin

          BUILD_ARGS=""
          IFS=',' read -ra TAG_ARR <<< "$TAGS"
          for tag in "${TAG_ARR[@]}"; do
            BUILD_ARGS="$BUILD_ARGS -t $tag"
          done

          docker build \
            -f src/main/docker/Dockerfile.jvm \
            $BUILD_ARGS .

          for tag in "${TAG_ARR[@]}"; do
            docker push "$tag"
          done
