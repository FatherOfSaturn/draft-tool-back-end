cubeCobraHostName/mp-rest/url=https://cubecobra.com

quarkus.http.cors.origins=https://pyramiddraft.xyz,https://dev.pyramiddraft.xyz

quarkus.mongodb.connection-string=${MONGO_CONNECTION}

google.oauth.dev-mode=false

# APP_JWT_SECRET is required in prod (no fallback). Must be a base64url-encoded
# key of >= 32 bytes when decoded, e.g. a 48-byte secret.
smallrye.jwt.sign.key={"kty":"oct","k":"${APP_JWT_SECRET}"}
smallrye.jwt.verify.secretkey={"kty":"oct","k":"${APP_JWT_SECRET}"}

