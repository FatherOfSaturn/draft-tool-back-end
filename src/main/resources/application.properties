cubeOwner=adam
devCubeOwner=adam

# OpenAPI / Swagger UI: spec served at /q/openapi, UI at /q/swagger-ui
quarkus.smallrye-openapi.info-title=Magic Draft Tool API
quarkus.smallrye-openapi.info-version=1.0.0
quarkus.smallrye-openapi.info-description=REST API for the Magic: The Gathering draft tool. Covers lobbies, pyramid, classic and burn drafts, accounts, decks, game history, support tickets, Scryfall lookups, and admin operations. Authenticated endpoints require Authorization: Bearer <JWT>.
quarkus.swagger-ui.always-include=true

quarkus.http.access-log.enabled=true

# Per-client-IP rate limiting (in-memory, per-instance)
rate-limit.enabled=true
# X-Forwarded-For is only honored when the direct peer is a trusted proxy
rate-limit.trust-forwarded-header=false
# Comma-separated proxy IPs that may set X-Forwarded-For (empty = header never trusted)
rate-limit.trusted-proxies=
rate-limit.login.max=20
rate-limit.login.window=PT60S
rate-limit.scryfall.max=120
rate-limit.scryfall.window=PT60S
rate-limit.lobby.max=60
rate-limit.lobby.window=PT60S
rate-limit.support.max=20
rate-limit.support.window=PT60S
rate-limit.game.max=120
rate-limit.game.window=PT60S

quarkus.http.auth.proactive=false
quarkus.http.limits.max-body-size=1M

# JWT: issued at /account/login, verified on every request.
# APP_JWT_SECRET must be a base64url-encoded key of >= 32 bytes when decoded;
# it is embedded in an "oct" JWK for both signing and verification.
smallrye.jwt.new-token.signature-algorithm=HS256
smallrye.jwt.sign.key={"kty":"oct","k":"${APP_JWT_SECRET}"}
smallrye.jwt.verify.secretkey={"kty":"oct","k":"${APP_JWT_SECRET}"}
smallrye.jwt.verify.algorithm=HS256
# Issuer embedded by JwtService; SmallRye JWT rejects tokens with any other iss
mp.jwt.verify.issuer=magic-draft

quarkus.http.cors.enabled=true
quarkus.http.cors.methods=GET,POST,PATCH,PUT,DELETE,OPTIONS
quarkus.http.cors.headers=Content-Type,Authorization,X-Requested-With,Content-Length,Accept,Origin,X-Player-Token

quarkus.mongodb.database=MTGames

google.oauth.client-id=346763937043-5n1404id5rp57prha5ltf2rik6u5qnu5.apps.googleusercontent.com

scryfallApi/mp-rest/url=https://api.scryfall.com
scryfall.max-search-pages=5
scryfall.cache.enabled=true
scryfall.cache.bulk-data-type=default_cards

quarkus.vertx.warning-exception-time=120s

# Comma-separated list of admin email addresses
admin.emails=

# Test profile: integration tests talk to a running MongoDB on localhost.
# A connection string disables Dev Services (which needs Docker) — CI/dev
# machines either run mongod locally or have Docker available.
# CI jobs with a containerised MongoDB can override the address, e.g.
# MONGO_TEST_CONNECTION_STRING=mongodb://mongodb:27017
%test.quarkus.mongodb.connection-string=${MONGO_TEST_CONNECTION_STRING:mongodb://127.0.0.1:27017}
# Fail fast when the test database is unreachable (CI misconfiguration)
# instead of waiting the default 30s per test class.
%test.quarkus.mongodb.server-selection-timeout=5S
%test.quarkus.mongodb.connect-timeout=5S
# Dev-mode token verification so @QuarkusTest flows authenticate without Google
%test.google.oauth.dev-mode=true
# Same committed dev fallback secret as the dev profile (test-only value)
%test.smallrye.jwt.sign.key={"kty":"oct","k":"H8L1LSm7ezUGp9eQZ8v5MgdDEwnCnM-qHd4A2kmE0CSijIxeznc8LYt0xPKwhmpt"}
%test.smallrye.jwt.verify.secretkey={"kty":"oct","k":"H8L1LSm7ezUGp9eQZ8v5MgdDEwnCnM-qHd4A2kmE0CSijIxeznc8LYt0xPKwhmpt"}
# Tests share one client IP; disable rate limiting so the suite never trips 429
%test.rate-limit.enabled=false
# Do not attempt a Scryfall bulk import during tests
%test.scryfall.cache.enabled=false
# Test admin account (login with a dev token bearing this email gets the admin role)
%test.admin.emails=it-admin@example.com
# Security diagnostics for integration tests
%test.quarkus.log.category."io.smallrye.jwt".level=DEBUG
%test.quarkus.log.category."io.quarkus.security".level=DEBUG
