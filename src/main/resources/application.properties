cubeOwner=adam
devCubeOwner=adam

# OpenAPI / Swagger UI: spec served at /q/openapi, UI at /q/swagger-ui
quarkus.smallrye-openapi.info-title=Magic Draft Tool API
quarkus.smallrye-openapi.info-version=1.0.0
quarkus.smallrye-openapi.info-description=REST API for the Magic: The Gathering draft tool. Covers lobbies, pyramid and classic drafts, accounts, decks, game history, support tickets, Scryfall lookups, and admin operations. Authenticated endpoints require Authorization: Bearer <JWT>.
quarkus.swagger-ui.always-include=true

quarkus.http.access-log.enabled=true

# Per-client-IP rate limiting (in-memory, per-instance)
rate-limit.enabled=true
# X-Forwarded-For is only honored when the direct peer is a trusted proxy
rate-limit.trust-forwarded-header=false
# Comma-separated proxy IPs that may set X-Forwarded-For (empty = header never trusted)
rate-limit.trusted-proxies=
rate-limit.login.max=20
rate-limit.login.window=PT60S
rate-limit.scryfall.max=120
rate-limit.scryfall.window=PT60S
rate-limit.lobby.max=60
rate-limit.lobby.window=PT60S
rate-limit.support.max=20
rate-limit.support.window=PT60S
rate-limit.game.max=120
rate-limit.game.window=PT60S

quarkus.http.auth.proactive=false
quarkus.http.limits.max-body-size=1M

# JWT: issued at /account/login, verified on every request.
# APP_JWT_SECRET (>= 32 bytes) must be provided via env in production.
smallrye.jwt.new-token.signature-algorithm=HS256
smallrye.jwt.new-token.signing-key.secret-key=${APP_JWT_SECRET}
smallrye.jwt.verify.key.secret-key=${APP_JWT_SECRET}

quarkus.http.cors=true
quarkus.http.cors.paths=/*
quarkus.http.cors.methods=GET,POST,PATCH,PUT,DELETE,OPTIONS
quarkus.http.cors.headers=Content-Type,Authorization,X-Requested-With,Content-Length,Accept,Origin,X-Player-Token

quarkus.mongodb.database=MTGames

google.oauth.client-id=346763937043-5n1404id5rp57prha5ltf2rik6u5qnu5.apps.googleusercontent.com

scryfallApi/mp-rest/url=https://api.scryfall.com
scryfall.max-search-pages=5
scryfall.cache.enabled=true
scryfall.cache.bulk-data-type=default_cards

quarkus.vertx.warning-exception-time=120s

# Comma-separated list of admin email addresses
admin.emails=
